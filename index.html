<style>
/* A marca é escura por definição: o mesmo esquema vale para claro e escuro */
:root{--bg:#1F2328;--fg:#F5F3EE;--muted:#A3A8B0;--dim:#4A5059;--org:#FF6B35;--ink:#1F2328}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F2328;--fg:#F5F3EE;--muted:#A3A8B0;--dim:#4A5059}}
:root[data-theme="dark"]{--bg:#1F2328;--fg:#F5F3EE;--muted:#A3A8B0;--dim:#4A5059}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.stage{position:relative;height:100%;display:grid;place-items:center;padding:24px}

/* ---------- intro ---------- */
.intro{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.intro .mono{width:clamp(92px,16vmin,150px);height:auto;overflow:visible;transform:translateY(-6vmin)}
.seg{fill:none;stroke:var(--fg);stroke-width:13;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l)}
.s1{--l:55}.s2{--l:91}.s3{--l:31}
.dot{fill:var(--org);transform-box:fill-box;transform-origin:center;opacity:0}
.words{position:absolute;left:0;right:0;top:calc(50% + 7vmin);height:1.4em;font-family:'Sora',sans-serif;font-weight:700;letter-spacing:.42em;text-indent:.42em;text-align:center;font-size:clamp(20px,4.6vmin,44px);color:var(--muted)}
.words span{position:absolute;inset:0;opacity:0}
.play .s1{animation:draw .75s .25s cubic-bezier(.65,0,.35,1) forwards}
.play .s2{animation:draw .9s 1.15s cubic-bezier(.65,0,.35,1) forwards}
.play .s3{animation:draw .55s 2.2s cubic-bezier(.65,0,.35,1) forwards}
.play .dot{animation:drop .7s 2.75s cubic-bezier(.34,1.56,.64,1) forwards}
.play .w1{animation:word 1s .2s both}
.play .w2{animation:word 1.05s 1.15s both}
.play .w3{animation:word 1.15s 2.15s both}
.intro.out{animation:fadeout .55s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes drop{0%{opacity:1;transform:translateY(-260%) scale(.6)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes word{0%{opacity:0;transform:translateY(.6em);filter:blur(4px)}22%,74%{opacity:1;transform:none;filter:none}100%{opacity:0;transform:translateY(-.4em);filter:blur(3px)}}
@keyframes fadeout{to{opacity:0;transform:scale(.94)}}

/* ---------- final ---------- */
.final{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(18px,3.2vmin,30px);opacity:0}
.final .wm{width:min(78vw,540px);height:auto;display:block}
.tag{margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(11px,1.9vmin,17px);letter-spacing:.32em;text-indent:.32em;color:var(--muted);text-transform:uppercase}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:clamp(6px,2vmin,18px);padding:14px 26px;border-radius:999px;background:var(--org);color:var(--ink);font-weight:600;font-size:clamp(14px,1.9vmin,17px);text-decoration:none;transition:transform .2s ease,box-shadow .2s ease}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px rgba(255,107,53,.55)}
.cta:focus-visible,.ig:focus-visible{outline:3px solid var(--fg);outline-offset:4px}
.cta svg{width:19px;height:19px}
.ig{color:var(--muted);font-weight:500;font-size:14px;text-decoration:none;letter-spacing:.02em;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.ig:hover{color:var(--fg);border-color:var(--org)}
.show .final{animation:rise .9s cubic-bezier(.16,1,.3,1) forwards}
.show .final>*{opacity:0;animation:rise .8s cubic-bezier(.16,1,.3,1) forwards}
.show .final>:nth-child(1){animation-delay:.05s}.show .final>:nth-child(2){animation-delay:.25s}.show .final>:nth-child(3){animation-delay:.45s}.show .final>:nth-child(4){animation-delay:.6s}
.wm .wdot{transform-box:fill-box;transform-origin:center}
.show .wm .wdot{animation:pop .6s .55s cubic-bezier(.34,1.56,.64,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
footer{position:fixed;left:0;right:0;padding:0 20px;line-height:1.7;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;font-size:12px;color:var(--dim);letter-spacing:.06em;opacity:0}
.show footer{animation:rise .8s 1s forwards}
.skip{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:none;border:0;color:var(--dim);font:500 12px 'Inter',sans-serif;cursor:pointer;padding:6px}
.show .skip{display:none}
@media (prefers-reduced-motion:reduce){.intro{display:none}.final,.final>*,footer{opacity:1!important;animation:none!important}.skip{display:none}}
</style>
</head>

<script>
// ====== CONFIGURE AQUI ======
// Coloque o WhatsApp com DDI + DDD, só números (ex.: '5527999999999').
// Enquanto estiver vazio, o botão leva para o Instagram.
const WHATSAPP = '5527999951802';
const MENSAGEM = 'Olá! Vim pelo site da Mant. CO e quero conversar.';
// ============================
(function(){
  const cta=document.getElementById('cta'), stage=document.getElementById('stage'), intro=document.getElementById('intro');
  if(WHATSAPP){ cta.href='https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(MENSAGEM); }
  else { cta.href='https://instagram.com/mant.corp'; document.getElementById('ctaText').textContent='Falar no Instagram'; cta.querySelector('svg').style.display='none'; }
  let done=false;
  function finish(){ if(done) return; done=true; intro.classList.add('out'); stage.classList.add('show'); setTimeout(()=>intro.remove(),900); }
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ stage.classList.add('show'); intro.remove(); return; }
  setTimeout(finish,3850);
  document.getElementById('skip').addEventListener('click',()=>{intro.style.animation='fadeout .3s forwards';intro.classList.remove('play');finish();});
})();
</script>
